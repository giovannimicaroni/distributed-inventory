services:
  node1:
    build: .
    environment:
      NODE_ID: "1"
      NODE_PORT: "50051"
      PEERS: "node2:50052,node3:50053,node4:50054"
    networks: [cluster]

  node2:
    build: .
    environment:
      NODE_ID: "2"
      NODE_PORT: "50052"
      PEERS: "node1:50051,node3:50053,node4:50054"
    networks: [cluster]

  node3:
    build: .
    environment:
      NODE_ID: "3"
      NODE_PORT: "50053"
      PEERS: "node1:50051,node2:50052,node4:50054"
    networks: [cluster]

  node4:
    build: .
    environment:
      NODE_ID: "4"
      NODE_PORT: "50054"
      PEERS: "node1:50051,node2:50052,node3:50053"
    networks: [cluster]

networks:
  cluster:
    driver: bridge
